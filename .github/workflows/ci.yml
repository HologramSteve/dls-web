name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (with wasm32 target)
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - name: Test (native)
        run: cargo test --release --manifest-path rust/dls-sim/Cargo.toml
      - name: Build WebAssembly
        run: cargo build --manifest-path rust/dls-sim/Cargo.toml --profile wasm --target wasm32-unknown-unknown

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dls-web .
      - name: Smoke test (app + health check + websocket)
        run: |
          docker run -d --name dls -p 8787:8787 dls-web
          for i in $(seq 1 30); do curl -sf http://localhost:8787/healthz && break; sleep 1; done
          curl -sf http://localhost:8787/ | grep -q "<html"
          docker exec dls bun -e "const ws = new WebSocket('ws://localhost:8787/ws'); ws.onopen = () => { console.log('websocket ok'); process.exit(0); }; ws.onerror = () => process.exit(1); setTimeout(() => process.exit(1), 5000);"
          docker logs dls
