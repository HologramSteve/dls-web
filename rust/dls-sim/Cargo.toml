[package]
name = "dls-sim"
version = "0.1.0"
edition = "2021"
description = "Fast Digital Logic Sim simulation engine (same semantics as the original's Simulator), compiled to native and WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# WebAssembly build: cargo build --profile wasm --target wasm32-unknown-unknown
[profile.wasm]
inherits = "release"
panic = "abort"
